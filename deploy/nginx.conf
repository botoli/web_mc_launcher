# This server has its own IP certificate; the main server's domain is unchanged.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    # Bind the compatibility port only to the external IP: Express owns loopback:3000.
    listen 87.58.220.248:3000;
    server_name 87.58.220.248;

    location /.well-known/acme-challenge/ { root /var/www/mc-launcher-acme; }
    location / { return 308 https://87.58.220.248$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 3443 ssl;
    listen [::]:3443 ssl;
    server_name 87.58.220.248;
    ssl_certificate /etc/letsencrypt/live/mc-launcher-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mc-launcher-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MCLTLS:10m;
    server_tokens off;
    # Application limit is 500 MiB per file; allow multipart framing overhead.
    client_max_body_size 512m;
    client_body_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }
}
