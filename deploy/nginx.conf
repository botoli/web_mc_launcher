# This server has its own IP certificate; the main server's domain is unchanged.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    # Bind the compatibility port only to the external IP: Express owns loopback:3000.
    listen 87.58.220.248:3000;
    server_name 87.58.220.248;

    location /.well-known/acme-challenge/ { root /var/www/mc-launcher-acme; }
    location / { return 308 https://87.58.220.248$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    listen 3443 ssl http2;
    listen [::]:3443 ssl http2;
    server_name 87.58.220.248;
    ssl_certificate /etc/letsencrypt/live/mc-launcher-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mc-launcher-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MCLTLS:10m;
    server_tokens off;
    # Application limit is 500 MiB per file; allow multipart framing overhead.
    client_max_body_size 512m;
    client_body_timeout 120s;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json;

    # Build assets do not need authentication or a database transaction.
    location ^~ /_next/static/ {
        alias /opt/mc-launcher/web_mc_launcher/apps/web/.next/static/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        etag on;
    }

    # Background filenames contain a content hash; replacing an image uses a new URL.
    # Serve public assets directly without passing through Express and Next.js.
    location ^~ /backgrounds/ {
        alias /opt/mc-launcher/web_mc_launcher/apps/web/public/backgrounds/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        etag on;
    }

    # Self-contained fallback: works even when both Node.js processes are down.
    location ^~ /_error-pages/ {
        internal;
        alias /opt/mc-launcher/web_mc_launcher/deploy/error-pages/;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location = /errors/404 {
        error_page 404 /_error-pages/404.html;
        return 404;
    }

    location = /errors/500 {
        error_page 500 /_error-pages/500.html;
        return 500;
    }

    location = /errors/502 {
        error_page 502 /_error-pages/502.html;
        return 502;
    }

    location = /errors/503 {
        error_page 503 /_error-pages/503.html;
        return 503;
    }

    location = /errors/504 {
        error_page 504 /_error-pages/504.html;
        return 504;
    }

    # API, file downloads and framework requests retain their response formats.
    location ~ ^/(api(?:/|$)|download(?:/|$)|mods/|_next/) {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }

    location / {
        proxy_intercept_errors on;
        error_page 500 /_error-pages/500.html;
        error_page 502 /_error-pages/502.html;
        error_page 503 /_error-pages/503.html;
        error_page 504 /_error-pages/504.html;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }
}
