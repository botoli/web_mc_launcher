# Bootstrap only: install this before issuing the play.nevermoreland.ru certificate.
# Run alongside the existing administrative virtual host on 89.125.214.122.
server {
    listen 80;
    listen [::]:80;
    server_name play.nevermoreland.ru;
    server_tokens off;

    # Do not become a catch-all site if this is the first loaded virtual host.
    if ($host != play.nevermoreland.ru) { return 444; }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/nevermoreland-play-acme;
        try_files $uri =404;
    }

    location / { return 404; }
}
