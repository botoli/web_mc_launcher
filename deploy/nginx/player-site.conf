# Existing app: Express 127.0.0.1:3000, Next.js 127.0.0.1:3001.
# Install after issuing the separate play.nevermoreland.ru certificate.
server {
    listen 80;
    listen [::]:80;
    server_name play.nevermoreland.ru;
    server_tokens off;
    if ($host != play.nevermoreland.ru) { return 444; }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/nevermoreland-play-acme;
        try_files $uri =404;
    }

    location / { return 308 https://play.nevermoreland.ru$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name play.nevermoreland.ru;
    ssl_certificate /etc/letsencrypt/live/play.nevermoreland.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/play.nevermoreland.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    absolute_redirect off;
    if ($host != play.nevermoreland.ru) { return 444; }

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 180s;
    # Stream launcher archives without writing them to Nginx's temporary files.
    proxy_buffering off;
    client_max_body_size 1m;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json;

    location = / { return 302 /play$is_args$args; }

    # Explicit public routes only. In particular, never proxy all /api or /_next.
    location ~ ^/play(?:/(?:how-to-play|telegram|download))?/?$ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:3001;
    }

    location ^~ /_next/static/ {
        alias /opt/mc-launcher/web_mc_launcher/apps/web/.next/static/;
        autoindex off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        etag on;
    }

    location ~ ^/backgrounds/(player-[a-z0-9.-]+\.webp)$ {
        alias /opt/mc-launcher/web_mc_launcher/apps/web/public/backgrounds/$1;
        add_header Cache-Control "public, max-age=31536000, immutable";
        etag on;
    }

    # Blocks login, registration, profiles, administrative API and launcher API.
    location / { return 404; }
}
